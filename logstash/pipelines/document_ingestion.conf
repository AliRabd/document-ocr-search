# Runs the dispatcher on a schedule. The dispatcher keeps a state file, so
# unchanged files are skipped and each run only processes new/changed files.
#
# All environment-specific values come from environment variables (or the
# Logstash keystore). Nothing sensitive is stored in this file.
#   PYTHON_BIN, DISPATCHER_SCRIPT, INPUT_DIR (read by the dispatcher)
#   ES_HOST, ES_INDEX, ES_USER, ES_PASSWORD, ES_CA_CERT
input {
  exec {
    command => "${PYTHON_BIN:/opt/ocr/venv/bin/python} ${DISPATCHER_SCRIPT:/opt/ocr/main_dispatcher.py}"
    interval => 300
    codec => json_lines
  }
}

filter {
  # Extractors already set filename, doc_id, doc_type, etc.
  # Lines that are not valid JSON are tagged _jsonparsefailure by the codec.
  if "_jsonparsefailure" in [tags] {
    drop { }
  }
  mutate {
    # `command`/`host` fields added by the exec input are noise in the index
    remove_field => ["command", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST:https://ES_HOST_PLACEHOLDER:9200}"]
    index => "${ES_INDEX:all_extractor}"
    document_id => "%{doc_id}"
    user => "${ES_USER:elastic}"
    password => "${ES_PASSWORD}"
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/http_ca.crt}"]
  }

  # Enable only while debugging (high log volume):
  # stdout { codec => rubydebug }
}
